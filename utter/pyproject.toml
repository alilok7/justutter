[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "utter"
version = "0.1.0"
description = "Local, open-source, hold-to-talk dictation for Windows."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "faster-whisper==1.2.1",
    "sounddevice==0.5.6",
    "keyboard==0.13.5",
    "pyperclip==1.11.0",
    "numpy>=2.0",
    "pydantic==2.14.2",
    "PySide6-Essentials==6.10.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1"]

[project.scripts]
utter = "utter.__main__:main"

[tool.setuptools]
packages = ["utter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["keyboard", "keyboard.*", "sounddevice", "pyperclip", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
